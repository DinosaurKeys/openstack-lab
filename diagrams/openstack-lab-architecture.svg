<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">OpenStack three-node HA learning lab</title>
  <desc id="desc">Separate management VM connects to three OpenStack nodes. Each node runs controller, network, and compute roles and is reported by the lab owner to be part of the existing HA configuration. Exact HA mechanisms require live verification.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1"/></pattern>
    <style>
      .title{font:700 30px sans-serif;fill:#f8fafc}.subtitle{font:16px sans-serif;fill:#94a3b8}
      .label{font:700 19px sans-serif;fill:#f8fafc}.small{font:15px sans-serif;fill:#cbd5e1}
      .tiny{font:13px sans-serif;fill:#94a3b8}.box{stroke-width:2;rx:16}
      .mgmt{fill:#0c4a6e;stroke:#22d3ee}.node{fill:#172554;stroke:#818cf8}
      .ha{fill:#064e3b;stroke:#34d399}.boundary{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:10 7;rx:20}
    </style>
  </defs>
  <rect width="1400" height="900" fill="#020617"/><rect width="1400" height="900" fill="url(#grid)" opacity=".8"/>
  <text x="70" y="65" class="title">OpenStack Lab — existing three-node HA cluster</text>
  <text x="70" y="98" class="subtitle">Learning phases inspect the services; they do not imply dedicated single-role nodes.</text>
  <rect x="55" y="140" width="1290" height="340" class="boundary"/>
  <text x="80" y="173" class="small">Management / API LAN — node addresses shown; management VM must use a separate address</text>
  <rect x="90" y="235" width="220" height="150" class="box mgmt"/>
  <text x="200" y="275" text-anchor="middle" class="label">Management VM</text>
  <text x="200" y="308" text-anchor="middle" class="small">Git · Ansible · tools</text>
  <text x="200" y="343" text-anchor="middle" class="tiny">SSH / API checks</text>
  <path d="M310 310H390M690 310H765M1065 310H1140" fill="none" stroke="#22d3ee" stroke-width="4"/>
  <rect x="390" y="215" width="300" height="205" class="box node"/>
  <rect x="765" y="215" width="300" height="205" class="box node"/>
  <rect x="1140" y="215" width="205" height="205" class="box node"/>
  <text x="540" y="255" text-anchor="middle" class="label">Node 1</text><text x="540" y="282" text-anchor="middle" class="small">192.168.0.200</text>
  <text x="540" y="324" text-anchor="middle" class="small">Controller · Network</text><text x="540" y="350" text-anchor="middle" class="small">Compute · HA member</text>
  <text x="915" y="255" text-anchor="middle" class="label">Node 2</text><text x="915" y="282" text-anchor="middle" class="small">192.168.0.201</text>
  <text x="915" y="324" text-anchor="middle" class="small">Controller · Network</text><text x="915" y="350" text-anchor="middle" class="small">Compute · HA member</text>
  <text x="1242" y="255" text-anchor="middle" class="label">Node 3</text><text x="1242" y="282" text-anchor="middle" class="small">192.168.0.202</text>
  <text x="1242" y="324" text-anchor="middle" class="small">Controller · Network</text><text x="1242" y="350" text-anchor="middle" class="small">Compute · HA member</text>
  <rect x="120" y="535" width="1160" height="145" class="box ha"/>
  <text x="700" y="575" text-anchor="middle" class="label">Existing HA — verify from live state</text>
  <text x="700" y="611" text-anchor="middle" class="small">Discover API/VIP, database and messaging topology, network-agent/router HA, compute, and storage behavior.</text>
  <text x="700" y="644" text-anchor="middle" class="tiny">A running service or moving VIP alone does not prove end-to-end availability or data durability.</text>
  <rect x="120" y="735" width="1160" height="105" class="boundary"/>
  <text x="700" y="775" text-anchor="middle" class="label">Learning order</text>
  <text x="700" y="810" text-anchor="middle" class="small">Linux → SSH/Ansible → discovery → networking → time → controller → network → compute → Cinder → failure tests → HA/VIP → Terraform → Grafana</text>
</svg>
