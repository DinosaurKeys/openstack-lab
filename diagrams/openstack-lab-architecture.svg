<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">OpenStack Lab — target Kolla-Ansible deployment</title>
  <desc id="desc">A separate management VM deploys a three-node Kolla-Ansible OpenStack lab. Every node is assigned control, network, and compute roles. The management LAN carries API and tunnel traffic, and a second network is reserved for Neutron provider networking.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1"/></pattern>
    <style>
      .title{font:700 30px sans-serif;fill:#f8fafc}.subtitle{font:16px sans-serif;fill:#94a3b8}
      .label{font:700 19px sans-serif;fill:#f8fafc}.small{font:15px sans-serif;fill:#cbd5e1}
      .tiny{font:13px sans-serif;fill:#94a3b8}.box{stroke-width:2;rx:16}
      .mgmt{fill:#0c4a6e;stroke:#22d3ee}.node{fill:#172554;stroke:#818cf8}
      .vip{fill:#064e3b;stroke:#34d399}.net{fill:#1e293b;stroke:#f59e0b;stroke-width:2;rx:16}
      .boundary{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:10 7;rx:20}
    </style>
  </defs>
  <rect width="1400" height="900" fill="#020617"/><rect width="1400" height="900" fill="url(#grid)" opacity=".8"/>
  <text x="70" y="65" class="title">OpenStack Lab — target Kolla-Ansible deployment</text>
  <text x="70" y="98" class="subtitle">Fresh Ubuntu Server install · three-node multi-role HA learning cluster</text>

  <rect x="55" y="140" width="1290" height="365" class="boundary"/>
  <text x="80" y="173" class="small">Management LAN — SSH, Ansible, APIs, Kolla VIP, and default tunnel path</text>

  <rect x="85" y="245" width="270" height="175" class="box mgmt"/>
  <text x="220" y="286" text-anchor="middle" class="label">Management VM</text>
  <text x="220" y="320" text-anchor="middle" class="small">Unique management IP</text>
  <text x="220" y="355" text-anchor="middle" class="small">Kolla-Ansible · OpenStack CLI</text>
  <text x="220" y="390" text-anchor="middle" class="tiny">Deployment host; not a cloud node</text>

  <path d="M355 330H400M700 330H735M1035 330H1070" fill="none" stroke="#22d3ee" stroke-width="4"/>
  <path d="M355 345H400M700 345H735M1035 345H1070" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="7 6"/>

  <rect x="400" y="225" width="300" height="225" class="box node"/>
  <rect x="735" y="225" width="300" height="225" class="box node"/>
  <rect x="1070" y="225" width="275" height="225" class="box node"/>

  <text x="550" y="265" text-anchor="middle" class="label">Node 1</text>
  <text x="550" y="294" text-anchor="middle" class="small">Node 1 management address</text>
  <text x="550" y="340" text-anchor="middle" class="small">control · network</text>
  <text x="550" y="368" text-anchor="middle" class="small">compute</text>
  <text x="550" y="413" text-anchor="middle" class="tiny">Ubuntu 24.04 · Kolla-Ansible</text>

  <text x="885" y="265" text-anchor="middle" class="label">Node 2</text>
  <text x="885" y="294" text-anchor="middle" class="small">Node 2 management address</text>
  <text x="885" y="340" text-anchor="middle" class="small">control · network</text>
  <text x="885" y="368" text-anchor="middle" class="small">compute</text>
  <text x="885" y="413" text-anchor="middle" class="tiny">Ubuntu 24.04 · Kolla-Ansible</text>

  <text x="1208" y="265" text-anchor="middle" class="label">Node 3</text>
  <text x="1208" y="294" text-anchor="middle" class="small">Node 3 management address</text>
  <text x="1208" y="340" text-anchor="middle" class="small">control · network</text>
  <text x="1208" y="368" text-anchor="middle" class="small">compute</text>
  <text x="1208" y="413" text-anchor="middle" class="tiny">Ubuntu 24.04 · Kolla-Ansible</text>

  <rect x="55" y="545" width="300" height="95" class="box vip"/>
  <text x="205" y="582" text-anchor="middle" class="label">Kolla API VIP</text>
  <text x="205" y="613" text-anchor="middle" class="small">Reserved management-subnet IP</text>

  <rect x="400" y="545" width="945" height="95" class="net"/>
  <text x="872" y="582" text-anchor="middle" class="label">Neutron provider Layer-2 network</text>
  <text x="872" y="613" text-anchor="middle" class="small">Shared provider switch · no host IP</text>

  <path d="M550 450V520M885 450V520M1208 450V520M550 520H1208M1208 520V545" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <text x="700" y="710" text-anchor="middle" class="small">Provider L2 is isolated unless an upstream router and address plan are added.</text>
  <text x="700" y="745" text-anchor="middle" class="tiny">For separate management, tunnel, and provider networks, add a third NIC per node.</text>
  <text x="700" y="810" text-anchor="middle" class="tiny">Target topology only; perform the actual installation by following FULL-INSTALLATION-GUIDE.md.</text>
</svg>
