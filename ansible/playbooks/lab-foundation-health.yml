---
# Run on the deployment host (sudo password is prompted locally):
# ansible-playbook -i /etc/kolla/multinode ansible/playbooks/lab-foundation-health.yml -K
# This is an optional, read-only local-service and sampled Galera status audit.
- name: Inspect foundation services on their inventory members
  hosts: mariadb:rabbitmq
  gather_facts: false
  become: true
  ignore_unreachable: true
  vars:
    foundation_services: "{{ (['mariadb'] if inventory_hostname in groups.get('mariadb', []) else []) + (['rabbitmq'] if inventory_hostname in groups.get('rabbitmq', []) else []) }}"
  tasks:
    - name: Read only container state and health
      ansible.builtin.command:
        argv: [docker, inspect, '--format', '{% raw %}{{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}{% endraw %}', '{{ item }}']
      loop: "{{ foundation_services }}"
      register: foundation_containers
      changed_when: false
      failed_when: false
      no_log: true

    - name: Find MariaDB healthcheck configuration inside container
      ansible.builtin.command:
        argv: [docker, exec, mariadb, test, -r, '{{ item }}']
      loop: [/etc/mysql/healthcheck.cnf, /etc/healthcheck.cnf]
      register: foundation_configs
      changed_when: false
      failed_when: false
      no_log: true
      when: "'mariadb' in foundation_services"

    - name: Run MariaDB local healthcheck
      ansible.builtin.command:
        argv: [docker, exec, mariadb, /usr/bin/healthcheck.sh, --defaults-file, '{{ item.item }}', --connect, --galera_online]
      loop: "{{ foundation_configs.results | default([]) }}"
      when: item.rc | default(1) == 0
      register: foundation_mariadb_check
      changed_when: false
      failed_when: false
      no_log: true

    - name: Read WSREP status with available healthcheck configurations
      ansible.builtin.command:
        argv: [docker, exec, mariadb, mariadb, '--defaults-file={{ item.item }}', --batch, --skip-column-names, -e, "SHOW GLOBAL STATUS WHERE Variable_name IN ('wsrep_cluster_status','wsrep_local_state_comment','wsrep_ready','wsrep_connected','wsrep_cluster_size','wsrep_cluster_state_uuid')"]
      loop: "{{ foundation_configs.results | default([]) }}"
      when: item.rc | default(1) == 0
      register: foundation_wsrep_queries
      changed_when: false
      failed_when: false
      no_log: true

    - name: Parse successful WSREP response
      ansible.builtin.set_fact:
        foundation_wsrep: >-
          {%- set queries = foundation_wsrep_queries.results | default([]) | selectattr('rc', 'defined') | selectattr('rc', 'equalto', 0) | list -%}
          {%- set ns = namespace(data={}, valid=true) -%}
          {%- if queries | length -%}
            {%- for line in queries[0].stdout_lines | default([]) -%}
              {%- set parts = line.split('\t') -%}
              {%- if parts | length != 2 or parts[0] in ns.data or not parts[1] -%}{%- set ns.valid = false -%}
              {%- else -%}{%- set _ = ns.data.update({parts[0]: parts[1]}) -%}{%- endif -%}
            {%- endfor -%}
          {%- else -%}{%- set ns.valid = false -%}{%- endif -%}
          {%- set required = ['wsrep_cluster_status','wsrep_local_state_comment','wsrep_ready','wsrep_connected','wsrep_cluster_size','wsrep_cluster_state_uuid'] -%}
          {{- ns.data if ns.valid and ns.data | length == 6 and required | difference(ns.data.keys() | list) | length == 0 and ns.data.wsrep_cluster_size is match('^[0-9]+$') and ns.data.wsrep_cluster_state_uuid is match('^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$') and ns.data.wsrep_cluster_state_uuid != '00000000-0000-0000-0000-000000000000' else {} -}}
      when: "'mariadb' in foundation_services"
      no_log: true

    - name: Run RabbitMQ local application diagnostic
      ansible.builtin.command:
        argv: [docker, exec, rabbitmq, rabbitmq-diagnostics, -q, check_running]
      when: "'rabbitmq' in foundation_services"
      register: foundation_rabbit_check
      changed_when: false
      failed_when: false
      no_log: true

- name: Summarize without displaying command output
  hosts: localhost
  gather_facts: false
  become: false
  vars:
    ansible_become: false
    foundation_groups: [mariadb, rabbitmq]
  tasks:
    - name: Report each expected service member
      ansible.builtin.debug:
        msg:
          service: "{{ item.0 }}"
          host: "{{ item.1 }}"
          status: >-
            {% set h = hostvars[item.1] %}
            {% set records = h.foundation_containers.results | default([]) | selectattr('item', 'equalto', item.0) | list %}
            {% set c = records[0] if records | length else {} %}
            {% set checks = h.foundation_mariadb_check.results | default([]) | selectattr('rc', 'defined') | list if item.0 == 'mariadb' else [h.foundation_rabbit_check | default({})] %}
            {% if c.unreachable | default(false) or c.rc is not defined %}BLOCKED (host unreachable or privilege/command unavailable)
            {% elif c.rc != 0 and 'no such object' in (c.stderr | default('') | lower) %}FAIL (container absent)
            {% elif c.rc != 0 %}BLOCKED (permission denied or Docker unavailable)
            {% elif c.stdout.split() | length != 2 %}BLOCKED (container state unavailable)
            {% elif c.stdout.split()[0] != 'running' %}FAIL (container not running)
            {% elif c.stdout.split()[1] == 'starting' %}BLOCKED (container healthcheck is still starting)
            {% elif c.stdout.split()[1] == 'unhealthy' %}FAIL (container unhealthy)
            {% elif c.stdout.split()[1] not in ['healthy', 'none'] %}BLOCKED (unknown container health)
            {% elif checks | length == 0 or checks[0].rc is not defined %}BLOCKED (application diagnostic unavailable)
            {% elif checks | selectattr('rc', 'equalto', 0) | list | length > 0 %}PASS (local diagnostic; Docker health {{ c.stdout.split()[1] }})
            {% elif checks | selectattr('rc', 'in', [125, 126, 127]) | list | length > 0 %}BLOCKED (application diagnostic unavailable)
            {% elif checks | selectattr('stderr', 'defined') | selectattr('stderr', 'search', '(?i)permission denied|not found|no such file') | list | length > 0 %}BLOCKED (application diagnostic unavailable)
            {% else %}FAIL (application diagnostic failed){% endif %}
      loop: "{{ foundation_groups | product((groups.get('mariadb', []) + groups.get('rabbitmq', [])) | unique | list) | selectattr('1', 'in', groups.get('all', [])) | list }}"
      when: item.1 in groups.get(item.0, [])
      register: foundation_report

    - name: Report sanitized Galera member state
      ansible.builtin.debug:
        msg: >-
          Galera member: {% set w = hostvars[item].foundation_wsrep | default({}) %}{% if w | length != 6 %}BLOCKED{% elif w.wsrep_cluster_status == 'Primary' and w.wsrep_local_state_comment == 'Synced' and w.wsrep_ready == 'ON' and w.wsrep_connected == 'ON' and w.wsrep_cluster_size | int == groups.get('mariadb', []) | length %}PASS{% else %}FAIL{% endif %}
      loop: "{{ groups.get('mariadb', []) }}"

    - name: Calculate sampled Galera status without exposing identifiers
      ansible.builtin.set_fact:
        foundation_galera_status: >-
          {% set ns = namespace(blocked=false, unhealthy=false, uuids=[]) %}
          {% set members = groups.get('mariadb', []) %}
          {% set shards = groups.keys() | select('match', '^mariadb[_-]shard') | list %}
          {% if members | length == 0 or shards | length > 1 %}{% set ns.blocked = true %}{% endif %}
          {% for host in members %}
            {% set w = hostvars[host].foundation_wsrep | default({}) %}
            {% if w | length != 6 %}{% set ns.blocked = true %}
            {% else %}
              {% set ns.uuids = ns.uuids + [w.wsrep_cluster_state_uuid] %}
              {% if w.wsrep_cluster_status != 'Primary' or w.wsrep_local_state_comment != 'Synced' or w.wsrep_ready != 'ON' or w.wsrep_connected != 'ON' or w.wsrep_cluster_size | int != members | length %}{% set ns.unhealthy = true %}{% endif %}
            {% endif %}
          {% endfor %}
          {% if ns.blocked %}BLOCKED{% elif ns.unhealthy or ns.uuids | unique | list | length != 1 %}FAIL{% else %}PASS{% endif %}
      no_log: true

    - name: Report Galera cluster
      ansible.builtin.debug:
        msg: "Galera cluster: {{ foundation_galera_status | trim }}"

    - name: State audit scope
      ansible.builtin.debug:
        msg: 'RabbitMQ cluster membership/quorum: NOT CHECKED. Galera counts and UUIDs are sampled sequentially and do not prove exact member identities or an atomic cluster view.'

    - name: Fail closed when any expected member is missing or not PASS
      ansible.builtin.assert:
        that:
          - groups.get('mariadb', []) | length > 0
          - groups.get('rabbitmq', []) | length > 0
          - foundation_galera_status | trim == 'PASS'
          - foundation_report.results | rejectattr('skipped', 'defined') | selectattr('msg.status', 'match', '^\\s*PASS\\b') | list | length == (groups.get('mariadb', []) | length + groups.get('rabbitmq', []) | length)
        fail_msg: 'FAIL or BLOCKED: audit incomplete or a service is not ready; see sanitized results above.'
        success_msg: 'PASS: expected hosts passed local checks and report consistent Galera state; exact member identities and RabbitMQ quorum not checked.'
