# Fresh-install template. Replace all placeholders before running Ansible.
all:
  vars:
    ansible_user: REPLACE_WITH_ADMIN_USER
    ansible_python_interpreter: /usr/bin/python3
  hosts:
    node1:
      ansible_host: NODE1_MGMT_IP
    node2:
      ansible_host: NODE2_MGMT_IP
    node3:
      ansible_host: NODE3_MGMT_IP
  children:
    controllers:
      hosts:
        node1:
        node2:
        node3:
    network_nodes:
      hosts:
        node1:
        node2:
        node3:
    compute_nodes:
      hosts:
        node1:
        node2:
        node3:
    openstack_nodes:
      children:
        controllers:
        network_nodes:
        compute_nodes:
